name: chinese-frontend

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - chinese-learning

networks:
  chinese-learning:
    external: true
    name: chinese-learning
